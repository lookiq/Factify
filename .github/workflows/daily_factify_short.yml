name: Daily Factify Shorts (Cloud Automation 24/7)

on:
  schedule:
    # 1. Early Commute: 6:15 AM EDT (10:15 UTC / 4:15 PM BST)
    - cron: '15 10 * * *'
    # 2. Midday Pre-Lunch: 10:45 AM EDT (14:45 UTC / 8:45 PM BST)
    - cron: '45 14 * * *'
    # 3. Afternoon Drive: 4:45 PM EDT (20:45 UTC / 2:45 AM BST next day)
    - cron: '45 20 * * *'
    # 4. Prime Evening / West Coast: 8:15 PM EDT (00:15 UTC / 6:15 AM BST next day)
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Specific Topic ID to generate (optional)'
        required: false
        default: ''

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fontconfig
          mkdir -p ~/.local/share/fonts
          cp pipeline/assets/fonts/*.ttf ~/.local/share/fonts/ || true
          fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          pip install requests edge-tts pillow numpy yt-dlp google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Run Master Cloud Pipeline with Telegram Approval
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_PRIVACY_STATUS: public
        run: |
          python pipeline/run_cloud_pipeline.py "${{ github.event.inputs.topic_id }}"

      - name: Commit & Push Progress
        run: |
          git config --global user.name "Factify Automation Bot"
          git config --global user.email "bot@factify.local"
          git add pipeline/topics_database.json upload_history.log PROGRESS.md || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(auto): update topic database and upload history [skip ci]"
          git push origin main || true
