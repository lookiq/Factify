name: Daily 4x Factify Shorts Autonomous Cloud Runner

on:
  schedule:
    # Slot 1: 11:30 UTC = 5:30 PM BST / 7:30 AM US Eastern (Morning Commute)
    - cron: '30 11 * * *'
    # Slot 2: 15:30 UTC = 9:30 PM BST / 11:30 AM US Eastern (Lunch Break)
    - cron: '30 15 * * *'
    # Slot 3: 22:30 UTC = 4:30 AM BST / 6:30 PM US Eastern (Prime Evening - Peak)
    - cron: '30 22 * * *'
    # Slot 4: 02:00 UTC = 8:00 AM BST / 10:00 PM US Eastern (Late Night Bedtime)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-freefont-ttf fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Factify Short (Voice + Footage + Subtitles)
        run: |
          python pipeline/build_short.py

      - name: Upload to Factify Shorts Channel
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: 'public'
        run: |
          python pipeline/upload_to_youtube.py

      - name: Commit Updated Topic Database & Upload History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add pipeline/topics_database.json upload_history.log || true
          git commit -m "chore(bot): update topic database after daily Factify upload [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"

