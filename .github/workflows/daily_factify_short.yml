name: Daily Factify Shorts (USA Prime Time 24/7)

on:
  schedule:
    # 1. US Morning Commute: 8:15 AM EDT (12:15 UTC / 6:15 PM BST)
    - cron: '15 12 * * *'
    # 2. US Lunch Peak: 12:45 PM EDT (16:45 UTC / 10:45 PM BST)
    - cron: '45 16 * * *'
    # 3. US Evening Prime Time: 6:45 PM EDT (22:45 UTC / 4:45 AM BST)
    - cron: '45 22 * * *'
    # 4. US West Coast / Night Owl: 10:15 PM EDT (02:15 UTC / 8:15 AM BST)
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Python Dependencies
        run: |
          pip install requests edge-tts pillow numpy google-api-python-client google-auth-oauthlib

      - name: Run USA Prime Time Automation Engine
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline/run_prime_time_automation.py

      - name: Commit & Push Progress
        run: |
          git config --global user.name "Factify Automation Bot"
          git config --global user.email "bot@factify.local"
          git add pipeline/topics_database.json upload_history.log PROGRESS.md || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(auto): update topic database and upload history [skip ci]"
          git push origin main || true
