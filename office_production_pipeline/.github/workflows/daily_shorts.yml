name: Daily 3x YouTube Shorts Autonomous Cloud Runner

on:
  schedule:
    # Runs everyday at 02:00 AM UTC (8:00 AM Bangladesh Time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web or mobile app!

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-freefont-ttf

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Restore YouTube Channel Credentials from Secrets
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_CONTENT: ${{ secrets.TOKEN_JSON }}
        run: |
          mkdir -p data
          echo "$CLIENT_SECRET_CONTENT" > client_secret.json
          echo "$TOKEN_CONTENT" > data/token.json

      - name: Run Daily 3x Shorts Generation & US Scheduler (with Full SEO)
        run: node src/daily_batch.js

      - name: Commit Updated Topic & Upload History
        run: |
          git config --global user.name "YouTube-Automation-Bot"
          git config --global user.email "bot@youtube-automation.local"
          git add data/topics_history.json data/upload_history.json data/token.json || true
          git commit -m "Auto: scheduled 3 daily shorts with SEO [skip ci]" || true
          git push || true
